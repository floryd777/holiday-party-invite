<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>406's Holiday Party</title>

    <link href="https://fonts.googleapis.com/css2?family=Mea+Culpa&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=GFS+Didot&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SCREEN 1: Closed invitation -->

    <section class="opening-screen" id="opening-screen">

        <button class="envelope" id="envelope"
                aria-label="Open invitation">
            <span class="envelope-back"></span>
            <span class="letter"></span>
            <span class="envelope-front"></span>
            <span class="envelope-flap"></span>
            <span class="bow"></span>
        </button>

        <button class="instruction" id="untie">
            Untie to reveal
        </button>

    </section>


    <!-- SCREEN 2: Revealed invitation -->

    <section class="invitation-screen" id="invitation-screen"
             hidden>

        <div class="title-section">

            <p class="subtitle">You're invited to</p>

            <h1 class="curved-heading">
                <svg viewBox="0 0 760 160"
                     role="img"
                     aria-label="406's Holiday Party">

                    <defs>
                        <path id="title-curve"
                              d="M15 137 Q380 55 745 137"/>
                    </defs>

                    <text class="curved-title">
                        <textPath href="#title-curve" startOffset="50%">406's Holiday Party</textPath>
                    </text>

                </svg>
            </h1>

            <p class="subtitle">A little holiday magic...</p>

<!-- Lace invitation card -->

<div class="lace-card">

    <div class="card-content">

        <svg class="evening-heading"
             viewBox="0 0 280 85"
             role="img"
             aria-label="An evening of">

            <defs>
                <path id="evening-curve"
                      d="M10 70 Q140 30 270 70"/>
            </defs>

            <text>
                <textPath href="#evening-curve"
                          startOffset="50%">An evening of</textPath>
            </text>

        </svg>

        <h2 class="celebration">Celebration</h2>

        <p class="card-details">
            Dinner &amp; Festivities
        </p>

        <p class="party-date">
            Dec 6th @ 6pm
        </p>

        <p class="card-details">
            The View
            <br>
            Apt 406
        </p>

        <button class="rsvp-button">
            RSVP
        </button>

    </div>

</div>

    </section>

    <script src="script.js"></script>

</body>
</html>
