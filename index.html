<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Holiday Party</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="opening-screen">

        <p class="subtitle">A little holiday magic...</p>

        <h1>You're Invited</h1>

        <button class="envelope" id="envelope"
                aria-label="Open invitation">
            <span class="envelope-back"></span>
            <span class="letter"></span>
            <span class="envelope-front"></span>
            <span class="envelope-flap"></span>
            <span class="bow"></span>
        </button>

        <p class="instruction">Untie to reveal</p>

    </main>

    <script src="script.js"></script>

</body>
</html>
